spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_inventory?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}   # required: set as an environment variable, never commit it
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # the schema is owned by Flyway (src/main/resources/db/migration)
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}       # required: a random string of at least 32 characters
    expiry-minutes: 60
  admin:                        # only used to create the first admin when the users table is empty
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
